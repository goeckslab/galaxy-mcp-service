services:
  galaxy-mcp-service:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      GALAXY_URL: ${GALAXY_URL:-}
      GALAXY_API_KEY: ${GALAXY_API_KEY:-}
      OAUTH_METADATA_URL: ${OAUTH_METADATA_URL:-}
      OAUTH_INTROSPECTION_CLIENT_ID: ${OAUTH_INTROSPECTION_CLIENT_ID:-}
      OAUTH_INTROSPECTION_CLIENT_SECRET: ${OAUTH_INTROSPECTION_CLIENT_SECRET:-}
      GALAXY_INSTANCES_JSON: ${GALAXY_INSTANCES_JSON:-}
